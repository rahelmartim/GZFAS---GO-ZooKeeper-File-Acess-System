name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      zookeeper:
        image: zookeeper:3.9
        ports:
          - 2181:2181
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Tests on the in-memory store and on ZooKeeper
        run: go test -race ./...
        env:
          ZOOKEEPER_SERVERS: localhost:2181
      - run: make web
      # The runner image includes Google Chrome.
      - name: Browser tests
        run: node --test web/test/dashboard.test.js
      - name: Docker image builds
        run: docker build -t gzfas .
